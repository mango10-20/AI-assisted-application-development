<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title>工业级 AGV 底盘开发 示意图</title>
  <desc>占位示意图：激光雷达 SLAM 建图、多点路径配置与目标跟随。</desc>
  <defs>
    <pattern id="p03" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#E2DED4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#F1EFE8"/>
  <rect width="1200" height="900" fill="url(#p03)"/>
  <text x="1140" y="800" font-size="360" fill="#E7E4DA" text-anchor="end" font-family="Georgia, serif">03</text>
  <text x="48" y="90" font-size="20" fill="#8A887E" letter-spacing="2">LIDAR SLAM / AUTONOMOUS NAVIGATION</text>
  <text x="1152" y="90" font-size="20" fill="#8A887E" text-anchor="end">PLACEHOLDER · 1200 x 900</text>

  <!-- SLAM 建图 -->
  <rect x="60" y="140" width="700" height="560" fill="#FFFFFF" stroke="#57554C" stroke-width="3"/>
  <g stroke="#EDEAE1" stroke-width="1">
    <line x1="130" y1="140" x2="130" y2="700"/>
    <line x1="200" y1="140" x2="200" y2="700"/>
    <line x1="270" y1="140" x2="270" y2="700"/>
    <line x1="340" y1="140" x2="340" y2="700"/>
    <line x1="410" y1="140" x2="410" y2="700"/>
    <line x1="480" y1="140" x2="480" y2="700"/>
    <line x1="550" y1="140" x2="550" y2="700"/>
    <line x1="620" y1="140" x2="620" y2="700"/>
    <line x1="690" y1="140" x2="690" y2="700"/>
    <line x1="60" y1="210" x2="760" y2="210"/>
    <line x1="60" y1="280" x2="760" y2="280"/>
    <line x1="60" y1="350" x2="760" y2="350"/>
    <line x1="60" y1="420" x2="760" y2="420"/>
    <line x1="60" y1="490" x2="760" y2="490"/>
    <line x1="60" y1="560" x2="760" y2="560"/>
    <line x1="60" y1="630" x2="760" y2="630"/>
  </g>
  <text x="84" y="176" font-size="16" fill="#8A887E">SLAM MAP / 激光雷达建图</text>
  <g fill="#B4B2A9">
    <rect x="150" y="250" width="16" height="16"/>
    <rect x="300" y="200" width="16" height="16"/>
    <rect x="430" y="260" width="16" height="16"/>
    <rect x="560" y="210" width="16" height="16"/>
    <rect x="220" y="420" width="16" height="16"/>
    <rect x="360" y="470" width="16" height="16"/>
    <rect x="500" y="430" width="16" height="16"/>
    <rect x="640" y="340" width="16" height="16"/>
    <rect x="120" y="540" width="16" height="16"/>
    <rect x="280" y="620" width="16" height="16"/>
    <rect x="470" y="560" width="16" height="16"/>
    <rect x="600" y="520" width="16" height="16"/>
    <rect x="660" y="620" width="16" height="16"/>
    <rect x="200" y="300" width="16" height="16"/>
  </g>

  <!-- AGV 起点 -->
  <rect x="120" y="640" width="46" height="32" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="3"/>
  <text x="186" y="662" font-size="15" fill="#57554C">起始位</text>

  <!-- 路径与途经点 -->
  <polyline points="150,656 300,560 260,470 430,360 620,270 660,440" fill="none" stroke="#185FA5" stroke-width="3" stroke-dasharray="14 10"/>
  <g fill="#E6F1FB" stroke="#185FA5" stroke-width="3">
    <circle cx="300" cy="560" r="8"/>
    <circle cx="260" cy="470" r="8"/>
    <circle cx="430" cy="360" r="8"/>
    <circle cx="620" cy="270" r="8"/>
  </g>
  <line x1="660" y1="410" x2="660" y2="470" stroke="#E24B4A" stroke-width="3"/>
  <line x1="630" y1="440" x2="690" y2="440" stroke="#E24B4A" stroke-width="3"/>
  <text x="620" y="392" font-size="15" fill="#A32D2D" text-anchor="end">目标点 · 精准停靠</text>
  <text x="736" y="676" font-size="15" fill="#8A887E" text-anchor="end">occupancy grid · 建图精度持续优化</text>

  <!-- 右侧能力清单 -->
  <g fill="#FFFFFF" stroke="#57554C" stroke-width="2">
    <rect x="800" y="150" width="352" height="84"/>
    <rect x="800" y="250" width="352" height="84"/>
    <rect x="800" y="350" width="352" height="84"/>
  </g>
  <g>
    <text x="824" y="190" font-size="19" fill="#2C2C2A">多点路径规划</text>
    <text x="824" y="216" font-size="16" fill="#8A887E">waypoints · 精准停靠</text>
    <text x="824" y="290" font-size="19" fill="#2C2C2A">目标跟随</text>
    <text x="824" y="316" font-size="16" fill="#8A887E">target following</text>
    <text x="824" y="390" font-size="19" fill="#2C2C2A">ROS ↔ 底层通信</text>
    <text x="824" y="416" font-size="16" fill="#8A887E">数据交互节点 · 串口</text>
  </g>
  <text x="800" y="480" font-size="17" fill="#57554C">工业场景测试 · 导航成功率优化</text>
  <text x="800" y="506" font-size="17" fill="#57554C">两台底盘协同开发 · 阶段性交付</text>

  <rect x="48" y="802" width="14" height="14" fill="#185FA5"/>
  <text x="78" y="816" font-size="26" fill="#2C2C2A">03 / 工业级 AGV 底盘开发</text>
  <text x="1152" y="816" font-size="20" fill="#8A887E" text-anchor="end">PLACEHOLDER · 1200 x 900</text>
  <rect x="48" y="848" width="1104" height="1" fill="#D5D1C6"/>
</svg>
