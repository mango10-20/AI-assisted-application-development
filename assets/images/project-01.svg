<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title>智能座舱实训系统 示意图</title>
  <desc>占位示意图：算法模块 / 硬件控制 / 学生代码沙箱三层架构与六大功能模块。</desc>
  <defs>
    <pattern id="p01" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#E2DED4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="#F1EFE8"/>
  <rect width="1600" height="720" fill="url(#p01)"/>
  <text x="1520" y="600" font-size="360" fill="#E7E4DA" text-anchor="end" font-family="Georgia, serif">01</text>
  <text x="48" y="90" font-size="20" fill="#8A887E" letter-spacing="2">SMART COCKPIT / TRAINING BENCH</text>
  <text x="1552" y="90" font-size="20" fill="#8A887E" text-anchor="end">PLACEHOLDER · 1600 x 720</text>

  <!-- 三层解耦架构 -->
  <text x="60" y="130" font-size="16" fill="#8A887E">三层解耦架构</text>
  <line x1="44" y1="150" x2="44" y2="478" stroke="#85B7EB" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="44" cy="200" r="6" fill="#185FA5"/>
  <circle cx="44" cy="316" r="6" fill="#185FA5"/>
  <circle cx="44" cy="438" r="6" fill="#185FA5"/>

  <g>
    <rect x="60" y="148" width="560" height="104" fill="#FFFFFF" stroke="#57554C" stroke-width="2"/>
    <rect x="60" y="148" width="8" height="104" fill="#185FA5"/>
    <text x="92" y="192" font-size="22" fill="#2C2C2A">算法模块</text>
    <text x="92" y="222" font-size="15" fill="#8A887E">统一的 AlgorithmModule 接口 · 各感知模块启停同构化</text>
  </g>
  <g>
    <rect x="60" y="264" width="560" height="104" fill="#FFFFFF" stroke="#57554C" stroke-width="2"/>
    <rect x="60" y="264" width="8" height="104" fill="#185FA5"/>
    <text x="92" y="308" font-size="22" fill="#2C2C2A">硬件控制</text>
    <text x="92" y="338" font-size="15" fill="#8A887E">座椅 / 车窗实物控制 · 串口通信</text>
  </g>
  <g>
    <rect x="60" y="380" width="560" height="116" fill="#FFFFFF" stroke="#57554C" stroke-width="2"/>
    <rect x="60" y="380" width="8" height="116" fill="#185FA5"/>
    <text x="92" y="424" font-size="22" fill="#2C2C2A">学生代码沙箱（六道关卡）</text>
    <text x="92" y="454" font-size="15" fill="#8A887E">AST 静态检查 · 导入白名单 · 危险调用禁用</text>
    <text x="92" y="478" font-size="15" fill="#8A887E">pyflakes 分析 · 子进程预检 · signature.bind 契约校验</text>
  </g>

  <!-- 六大功能模块 -->
  <text x="680" y="130" font-size="16" fill="#8A887E">六大功能模块 · 五类算法接口契约</text>
  <g fill="#FFFFFF" stroke="#D5D1C6" stroke-width="2">
    <rect x="680" y="148" width="124" height="64"/>
    <rect x="818" y="148" width="124" height="64"/>
    <rect x="956" y="148" width="124" height="64"/>
    <rect x="680" y="224" width="124" height="64"/>
    <rect x="818" y="224" width="124" height="64"/>
    <rect x="956" y="224" width="124" height="64"/>
  </g>
  <g font-size="17" fill="#57554C" text-anchor="middle">
    <text x="742" y="188">手势识别</text>
    <text x="880" y="188">疲劳监测</text>
    <text x="1018" y="188">人脸识别</text>
    <text x="742" y="264">语音交互</text>
    <text x="880" y="264">声源定位</text>
    <text x="1018" y="264">座椅·车窗</text>
  </g>

  <!-- 六麦环阵 -->
  <circle cx="770" cy="380" r="76" fill="none" stroke="#D5D1C6" stroke-width="2" stroke-dasharray="10 10"/>
  <g fill="#E6F1FB" stroke="#185FA5" stroke-width="3">
    <circle cx="846" cy="380" r="16"/>
    <circle cx="808" cy="314" r="16"/>
    <circle cx="732" cy="314" r="16"/>
    <circle cx="694" cy="380" r="16"/>
    <circle cx="732" cy="446" r="16"/>
    <circle cx="808" cy="446" r="16"/>
  </g>
  <circle cx="770" cy="380" r="8" fill="#57554C"/>
  <text x="884" y="356" font-size="18" fill="#12507F">M260C 六麦环阵</text>
  <text x="884" y="384" font-size="17" fill="#57554C">GCC-PHAT / SRP 声源定位</text>
  <text x="884" y="412" font-size="17" fill="#57554C">Jetson Orin 边缘部署</text>

  <rect x="48" y="640" width="14" height="14" fill="#185FA5"/>
  <text x="78" y="654" font-size="26" fill="#2C2C2A">01 / 智能座舱实训系统</text>
  <text x="1152" y="654" font-size="20" fill="#8A887E" text-anchor="end">已投入院校教学使用</text>
  <rect x="48" y="686" width="1504" height="1" fill="#D5D1C6"/>
</svg>
